<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😺 Gatíneos Arco-Íris 🌈</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; overflow-x:hidden;
    font-family: "Trebuchet MS", system-ui, sans-serif;
    background:linear-gradient(135deg,#ffe6f7,#e6f7ff,#fff3c4);
    color:#55345f;
  }
  header{text-align:center;padding:38px 20px 15px}
  h1{font-size:clamp(2.2rem,7vw,5rem);margin:0;filter:drop-shadow(0 5px 0 #fff)}
  .subtitle{font-size:1.15rem}
  .arena{
    max-width:1050px;margin:20px auto;padding:20px;
    display:grid;grid-template-columns:1fr 1fr;gap:24px;
  }
  .card{
    background:#ffffffcc;border:3px solid #fff;border-radius:30px;
    padding:25px;box-shadow:0 15px 35px #9b6db333;
    backdrop-filter:blur(8px);text-align:center;
  }
  .cat{
    position:relative;font-size:8rem;line-height:1;
    display:inline-block;cursor:pointer;user-select:none;
    transition:transform .25s;
  }
  .cat:hover{transform:scale(1.08) rotate(-3deg)}
  .cat.blow{animation:wiggle .5s}
  @keyframes wiggle{25%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}75%{transform:rotate(5deg)}}
  .rainbow{
    height:80px;margin:8px auto 20px;max-width:420px;
    border-radius:50% 50% 12px 12px;
    background:linear-gradient(90deg,#ff4d6d,#ff9f1c,#ffe66d,#51cf66,#4dabf7,#845ef7,#e64980);
    box-shadow:0 0 25px #fff;
    transform:scaleX(0);transform-origin:left;
    opacity:0;transition:.45s;
  }
  .rainbow.show{transform:scaleX(1);opacity:1}
  button{
    border:0;border-radius:999px;padding:14px 24px;font-size:1rem;
    font-weight:800;cursor:pointer;background:#8b5cf6;color:white;
    box-shadow:0 6px 0 #6841b8;transition:.15s;
  }
  button:hover{transform:translateY(-2px)}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #6841b8}
  .counter{font-size:1.2rem;font-weight:bold;margin-top:15px}
  .gallery{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
  .mini{
    background:#fff;border-radius:22px;padding:18px;font-size:4rem;
    cursor:pointer;transition:.2s;border:3px solid transparent;
  }
  .mini:hover{transform:translateY(-7px) rotate(2deg);border-color:#ffb3e6}
  #message{min-height:30px;font-weight:bold;margin:15px 0}
  .sparkle{position:fixed;pointer-events:none;font-size:24px;animation:fall 1s forwards}
  @keyframes fall{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(130px) scale(.2);opacity:0}}
  footer{text-align:center;padding:25px;font-size:.9rem}
  @media(max-width:700px){.arena{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}.gallery{grid-column:auto}}
</style>
</head>
<body>
<header>
  <h1>😺 Gatíneos Arco-Íris 🌈</h1>
  <div class="subtitle">O lugar onde gatinhos cospem arco-íris porque sim. ✨</div>
</header>

<main class="arena">
  <section class="card">
    <div id="cat" class="cat" title="Clique no gatinho!">😺</div>
    <div id="rainbow" class="rainbow"></div>
    <div id="message">Clique no botão e prepare-se para a magia!</div>
    <button id="blow">🌈 CUSPIR ARCO-ÍRIS!</button>
    <div class="counter">Arco-íris cuspidos: <span id="count">0</span></div>
  </section>

  <section class="card">
    <h2>🎀 Central de fofura</h2>
    <p>Escolha um gatinho para trocar o protagonista:</p>
    <div class="gallery">
      <div class="mini">😺</div>
      <div class="mini">😸</div>
      <div class="mini">😻</div>
      <div class="mini">😽</div>
      <div class="mini">🙀</div>
      <div class="mini">😹</div>
    </div>
  </section>
</main>

<footer>Feito com 100% de fofura, 0% de lógica e muitos arco-íris. 🐾</footer>

<script>
const cat=document.querySelector('#cat');
const rainbow=document.querySelector('#rainbow');
const button=document.querySelector('#blow');
const countEl=document.querySelector('#count');
const message=document.querySelector('#message');
let count=0;

function sparkles(){
  for(let i=0;i<14;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.textContent=['✨','🌟','💖','🌈'][Math.floor(Math.random()*4)];
    s.style.left=(window.innerWidth/2 + (Math.random()-.5)*300)+'px';
    s.style.top=(window.innerHeight*.45 + (Math.random()-.5)*120)+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1000);
  }
}
function blow(){
  count++;
  countEl.textContent=count;
  cat.classList.remove('blow'); void cat.offsetWidth; cat.classList.add('blow');
  rainbow.classList.remove('show'); void rainbow.offsetWidth; rainbow.classList.add('show');
  const msgs=[
    'MIAU! ARCO-ÍRIS LANÇADO! 🌈',
    'Esse gatinho tomou café colorido. ☕🌈',
    'ATENÇÃO: fofura em nível arco-íris! 🚨💖',
    'PLOFT! Mais um arco-íris! ✨',
    'O gatinho está oficialmente mágico. 🪄😺'
  ];
  message.textContent=msgs[Math.floor(Math.random()*msgs.length)];
  sparkles();
}
button.addEventListener('click',blow);
cat.addEventListener('click',blow);

document.querySelectorAll('.mini').forEach(m=>{
  m.addEventListener('click',()=>{
    cat.textContent=m.textContent;
    message.textContent='Novo gatinho selecionado! Agora ele pode cuspir arco-íris. 😼';
  });
});
</script>
</body>
</html>
